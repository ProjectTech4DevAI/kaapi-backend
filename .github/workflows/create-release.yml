name: Deploy Kaapi to ECS Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # Deploy only when tags like v1.0.0, v2.1.0, etc., are created

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Confirm CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Checking Kaapi CI conclusion for ${SHA}"
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}" \
            --jq 'first(.workflow_runs[]
                    | select(.name == "Kaapi CI" and .status == "completed")
                    | .conclusion) // "missing"')
          echo "Kaapi CI conclusion: ${CONCLUSION}"
          if [ "${CONCLUSION}" != "success" ]; then
            echo "::error::Kaapi CI has not passed for ${SHA} (conclusion: ${CONCLUSION}). Aborting release."
            exit 1
          fi

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: AWS_ENV_VARS

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_RESOURCE_PREFIX }}-repo
          TAG: ${{ github.ref_name }}
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t $REGISTRY/$REPOSITORY:latest \
            -t $REGISTRY/$REPOSITORY:$TAG \
            ./backend
          docker push $REGISTRY/$REPOSITORY:latest
          docker push $REGISTRY/$REPOSITORY:$TAG

      - name: Run database migrations
        env:
          CLUSTER: ${{ vars.AWS_RESOURCE_PREFIX }}-cluster
          SERVICE: ${{ vars.AWS_RESOURCE_PREFIX }}-service
          TASK_DEF: ${{ vars.AWS_RESOURCE_PREFIX }}-task
        run: |
          CONTAINER_NAME=$(aws ecs describe-task-definition --task-definition $TASK_DEF --query 'taskDefinition.containerDefinitions[0].name' --output text)

          NETWORK_CONFIG=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE \
            --query 'services[0].networkConfiguration' --output json | jq -c '.')

          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --launch-type FARGATE \
            --task-definition $TASK_DEF \
            --count 1 \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"uv\",\"run\",\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task started: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster $CLUSTER --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster $CLUSTER --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            aws ecs describe-tasks --cluster $CLUSTER --tasks "$TASK_ARN" \
              --query "tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containerReason:containers[?name=='$CONTAINER_NAME'].reason | [0]}" \
              --output json
            exit 1
          fi
          echo "Migration completed successfully"

      - name: Deploy to ECS and verify rollout
        # Bound the wait; the circuit breaker itself trips well before this.
        timeout-minutes: 15
        env:
          CLUSTER: ${{ vars.AWS_RESOURCE_PREFIX }}-cluster
          POLL_INTERVAL: "15"
        run: |
          deploy_and_wait() {
            SERVICE="$1"
            FAMILY="$2"
            echo "[$SERVICE] forcing new deployment on family $FAMILY"
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$SERVICE" \
              --task-definition "$FAMILY" \
              --force-new-deployment >/dev/null

            while true; do
              STATE=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" \
                --output text)
              case "$STATE" in
                COMPLETED)
                  echo "[$SERVICE] rollout COMPLETED"
                  return 0 ;;
                FAILED)
                  echo "::error::[$SERVICE] rollout FAILED — new tasks never became healthy (rolled back by circuit breaker)"
                  return 1 ;;
                *)
                  echo "[$SERVICE] rollout $STATE — waiting ${POLL_INTERVAL}s"
                  sleep "$POLL_INTERVAL" ;;
              esac
            done
          }

          deploy_and_wait "${{ vars.AWS_RESOURCE_PREFIX }}-service" "${{ vars.AWS_RESOURCE_PREFIX }}-task"
          deploy_and_wait "${{ vars.AWS_RESOURCE_PREFIX }}-celery-task" "${{ vars.AWS_RESOURCE_PREFIX }}-celery-task"

  notify:
    needs: [verify-ci, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NAME: kaapi-production
          RELEASE: ${{ github.ref_name }}
          # true only when the build+deploy job succeeded.
          OK: ${{ needs.build.result == 'success' }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "No webhook configured, skipping"; exit 0; }
          if [ "$OK" = "true" ]; then
            TITLE="🟢 $NAME deployment healthy"; COLOR=3066993   # green
          else
            TITLE="🔴 $NAME deployment failed";  COLOR=15158332  # red
          fi
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          payload=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg release "$RELEASE" \
            --arg sha "$SHA_SHORT" \
            --arg url "$RUN_URL" \
            '{embeds: [{
              title: $title, url: $url, color: $color,
              fields: [
                {name: "Release", value: $release, inline: true},
                {name: "SHA", value: $sha, inline: true}
              ],
              timestamp: (now | todate)
            }]}')
          curl -sf -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK_URL" \
            || echo "Discord notification failed to send"
