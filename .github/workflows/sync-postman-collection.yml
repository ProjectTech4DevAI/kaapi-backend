name: Sync Postman Collection

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/sync-postman-collection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postman-sync
  cancel-in-progress: true

env:
  OPENAPI_TO_POSTMAN_VERSION: "6.4.2"

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Prepare env file
        run: cp .env.test.example .env.test

      - name: Export OpenAPI schema
        working-directory: backend
        env:
          ENVIRONMENT: testing
        run: |
          uv sync --frozen
          uv run python scripts/kaapi_export_openapi.py "$GITHUB_WORKSPACE/openapi.yaml"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Convert to Postman collection
        env:
          npm_config_ignore_scripts: "true"
        run: |
          set -euo pipefail
          npx --yes "openapi-to-postmanv2@${OPENAPI_TO_POSTMAN_VERSION}" \
            -s openapi.yaml -o collection.json -p \
            -O folderStrategy=Tags,parametersResolution=Example
          if ! jq -e '.item | length > 0' collection.json > /dev/null 2>&1; then
            echo "::error::Postman conversion produced no collection"
            exit 1
          fi
          echo "Generated $(jq '[.. | objects | select(has("request"))] | length' collection.json) requests"

      - name: Upload collection
        uses: actions/upload-artifact@v7
        with:
          name: postman-collection
          path: collection.json
          retention-days: 1

  update:
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download collection
        uses: actions/download-artifact@v8
        with:
          name: postman-collection

      - name: Update Postman collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
          POSTMAN_BASE_URL: ${{ secrets.POSTMAN_BASE_URL }}
        run: |
          set -euo pipefail
          api="https://api.getpostman.com/collections/${POSTMAN_COLLECTION_UID}"

          curl -sS --fail-with-body "$api" -H "X-Api-Key: ${POSTMAN_API_KEY}" -o current.json

          jq -n --slurpfile cur current.json --slurpfile gen collection.json \
            --arg baseUrl "${POSTMAN_BASE_URL:-}" '
            ($cur[0].collection) as $c | $gen[0] as $g |
            ($c.variable // $g.variable // []) as $vars |
            {collection: ({
              info: {
                _postman_id: $c.info._postman_id,
                name: $c.info.name,
                description: ($c.info.description // $g.info.description),
                schema: $c.info.schema
              },
              item: ($g.item | walk(
                if type == "object" then del(.event) else . end
              ) | walk(
                if type == "object" and (.request | type) == "object"
                then .request |= (
                  del(.auth)
                  | .header = (
                      [(.header // [])[] | select((.key | ascii_downcase) != "authorization")]
                      + [{key: "Authorization", value: "Bearer {{KAAPI_AUTH_TOKEN}}", type: "text"}]
                    )
                )
                else . end
              )),
              variable: (
                if $baseUrl == "" then $vars
                elif any($vars[]; .key == "baseUrl")
                then $vars | map(if .key == "baseUrl" then .value = $baseUrl else . end)
                else $vars + [{key: "baseUrl", value: $baseUrl, type: "string"}]
                end
                | map(
                    if (.key | test("key|token|secret|password|auth"; "i"))
                    then .value = "" else . end
                  )
              ),
              auth: {
                type: "apikey",
                apikey: [
                  {key: "key", value: "X-API-KEY", type: "string"},
                  {key: "value", value: "{{KAAPI_API_KEY}}", type: "string"},
                  {key: "in", value: "header", type: "string"}
                ]
              },
              event: [($c.event // [])[] | select(.script.id != "kaapi-auth")]
            } | with_entries(select(.value != null)))}
          ' > payload.json

          curl -sS --fail-with-body -X PUT "$api" \
            -H "X-Api-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json -o /dev/null

          echo "Postman collection updated" | tee -a "$GITHUB_STEP_SUMMARY"
