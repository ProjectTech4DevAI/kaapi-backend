# Generate an API changelog by diffing the OpenAPI schema between base and HEAD.
name: oasdiff

on:
  pull_request:
    branches: ["main"]
    # Re-run when the approval label is added/removed so merge gating updates immediately.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Prepare env files
        # get_settings() loads `../.env.test` relative to the backend cwd when
        # ENVIRONMENT=testing, so the file must sit at the repo root of each checkout.
        run: |
          cp head/.env.test.example head/.env.test
          cp head/.env.test.example base/.env.test

      - name: Export base OpenAPI schema
        working-directory: base/backend
        env:
          ENVIRONMENT: testing
        run: |
          uv sync --frozen
          if [ -f scripts/export_openapi.py ]; then
            uv run python scripts/export_openapi.py "$GITHUB_WORKSPACE/base-openapi.yaml"
          else
            # Base ref predates this workflow; copy the HEAD script in to bootstrap.
            cp "$GITHUB_WORKSPACE/head/backend/scripts/export_openapi.py" scripts/
            uv run python scripts/export_openapi.py "$GITHUB_WORKSPACE/base-openapi.yaml"
          fi

      - name: Export HEAD OpenAPI schema
        working-directory: head/backend
        env:
          ENVIRONMENT: testing
        run: |
          uv sync --frozen
          uv run python scripts/export_openapi.py "$GITHUB_WORKSPACE/head-openapi.yaml"

      - name: Generate changelog (markdown)
        run: |
          docker run --rm -v "$PWD:/specs" tufin/oasdiff \
            changelog /specs/base-openapi.yaml /specs/head-openapi.yaml \
            --format markdown > changelog.md || true
          docker run --rm -v "$PWD:/specs" tufin/oasdiff \
            breaking /specs/base-openapi.yaml /specs/head-openapi.yaml \
            --format markdown > breaking.md || true

      - name: Debug raw oasdiff output
        run: |
          echo "=== breaking.md ==="
          cat breaking.md || echo "(missing)"
          echo
          echo "=== changelog.md ==="
          cat changelog.md || echo "(missing)"

      - name: Build PR comment body
        run: |
          # Treat a file as "has content" if it contains any non-whitespace character.
          has_content() { [ -s "$1" ] && grep -q '[^[:space:]]' "$1"; }

          {
            echo "## 📋 OpenAPI changes"
            echo
            if has_content breaking.md; then
              echo "### ⚠️ Breaking changes"
              echo
              cat breaking.md
              echo
            else
              echo "✅ No breaking changes detected."
              echo
            fi

            echo "<details><summary>Full changelog</summary>"
            echo
            if has_content changelog.md; then
              cat changelog.md
            else
              echo "_No API changes._"
            fi
            echo
            echo "</details>"
            echo
            echo "_Generated by [oasdiff](https://github.com/oasdiff/oasdiff) · commit \`${GITHUB_SHA::8}\`_"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: oasdiff
          path: comment.md

      - name: Fail on breaking changes
        # Skip the hard fail when a reviewer has explicitly acknowledged the breaking change
        # by applying the `breaking-change-approved` label to the PR.
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        uses: oasdiff/oasdiff-action/breaking@v0.0.48
        with:
          base: base-openapi.yaml
          revision: head-openapi.yaml
          fail-on: WARN
