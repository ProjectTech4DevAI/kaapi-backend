# Generate an API changelog by diffing the OpenAPI schema between base and HEAD.
name: oasdiff

on:
  pull_request:
    branches: ["main"]
    # Re-run when the approval label is added/removed so merge gating updates immediately.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Prepare env files
        # get_settings() loads `../.env.test` relative to the backend cwd when
        # ENVIRONMENT=testing, so the file must sit at the repo root of each checkout.
        run: |
          cp head/.env.test.example head/.env.test
          cp head/.env.test.example base/.env.test

      - name: Export base OpenAPI schema
        working-directory: base/backend
        env:
          ENVIRONMENT: testing
        run: |
          uv sync --frozen
          if [ -f scripts/export_openapi.py ]; then
            uv run python scripts/export_openapi.py "$GITHUB_WORKSPACE/base-openapi.yaml"
          else
            # Base ref predates this workflow; copy the HEAD script in to bootstrap.
            cp "$GITHUB_WORKSPACE/head/backend/scripts/export_openapi.py" scripts/
            uv run python scripts/export_openapi.py "$GITHUB_WORKSPACE/base-openapi.yaml"
          fi

      - name: Export HEAD OpenAPI schema
        working-directory: head/backend
        env:
          ENVIRONMENT: testing
        run: |
          uv sync --frozen
          uv run python scripts/export_openapi.py "$GITHUB_WORKSPACE/head-openapi.yaml"

      - name: Generate changelog (markdown)
        run: |
          docker run --rm -v "$PWD:/specs" tufin/oasdiff \
            changelog /specs/base-openapi.yaml /specs/head-openapi.yaml \
            --format markdown > changelog.md || true
          docker run --rm -v "$PWD:/specs" tufin/oasdiff \
            breaking /specs/base-openapi.yaml /specs/head-openapi.yaml \
            --format markdown > breaking.md || true

      - name: Debug raw oasdiff output
        run: |
          echo "=== breaking.md ==="
          cat breaking.md || echo "(missing)"
          echo
          echo "=== changelog.md ==="
          cat changelog.md || echo "(missing)"

      - name: Build PR comment body
        if: always()
        run: |
          # Count list items: oasdiff markdown emits one bullet/numbered line per change.
          count_items() { grep -cE '^([*-]|[0-9]+\.) ' "$1" 2>/dev/null || echo 0; }
          plural() { [ "$1" -ne 1 ] && echo s; }

          BREAKING=$(count_items breaking.md)
          CHANGES=$(count_items changelog.md)

          # Severity-driven theming: red badge + auto-expanded section when breaking,
          # green when only additive, gray when nothing changed at all.
          if [ "$BREAKING" -gt 0 ]; then
            ALERT='> [!SIREN]'
            BADGE="https://img.shields.io/badge/breaking-${BREAKING}-D1242F?style=for-the-badge&labelColor=24292F"
            HEADLINE="**${BREAKING} breaking change$(plural $BREAKING) detected** — downstream consumers may need an update before merging."
            BREAKING_OPEN=" open"
          elif [ "$CHANGES" -gt 0 ]; then
            ALERT='> [!TIP]'
            BADGE="https://img.shields.io/badge/additive-${CHANGES}-1F883D?style=for-the-badge&labelColor=24292F"
            HEADLINE="**${CHANGES} non-breaking change$(plural $CHANGES).** Safe to merge from an API-contract perspective."
            BREAKING_OPEN=""
          else
            ALERT='> [!NOTE]'
            BADGE="https://img.shields.io/badge/api-unchanged-6E7781?style=for-the-badge&labelColor=24292F"
            HEADLINE="**No API surface changes** in this PR."
            BREAKING_OPEN=""
          fi

          {
            echo "<h2>OpenAPI changes &nbsp; <img alt=\"status\" src=\"${BADGE}\" align=\"top\" /></h2>"
            echo
            echo "${ALERT}"
            echo "> ${HEADLINE}"
            echo

            if [ "$BREAKING" -gt 0 ]; then
              echo "<details${BREAKING_OPEN}>"
              echo "<summary>&nbsp;<b>Breaking changes</b> &nbsp;·&nbsp; <code>${BREAKING}</code> item$(plural $BREAKING)</summary>"
              echo
              cat breaking.md
              echo
              echo "</details>"
              echo
            fi

            if [ "$CHANGES" -gt 0 ]; then
              echo "<details>"
              echo "<summary>&nbsp;<b>Full changelog</b> &nbsp;·&nbsp; <code>${CHANGES}</code> item$(plural $CHANGES)</summary>"
              echo
              cat changelog.md
              echo
              echo "</details>"
              echo
            fi

            echo "<table align=\"right\"><tr>"
            echo "<td><sub>base</sub></td><td><sub><kbd>${GITHUB_BASE_REF}</kbd></sub></td>"
            echo "<td><sub>↔</sub></td>"
            echo "<td><sub>head</sub></td><td><sub><kbd>${GITHUB_SHA::8}</kbd></sub></td>"
            echo "</tr></table>"
            echo
            echo "<sub>generated by <a href=\"https://github.com/oasdiff/oasdiff\">oasdiff</a></sub>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: oasdiff
          path: comment.md

      - name: Fail on breaking changes
        # Skip the hard fail when a reviewer has explicitly acknowledged the breaking change
        # by applying the `breaking-change-approved` label to the PR.
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        uses: oasdiff/oasdiff-action/breaking@v0.0.48
        with:
          base: base-openapi.yaml
          revision: head-openapi.yaml
          fail-on: WARN
