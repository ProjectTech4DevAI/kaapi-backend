[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "python-multipart>=0.0.31,<1.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.0.1",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.20.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation>=0.51b0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-celery>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-requests>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    "pyjwt>=2.13.0,<3.0.0",
    "boto3>=1.37.20",
    "moto[s3]>=5.1.1",
    "openai>=1.100.1",
    "pre-commit>=3.8.0",
    "openai_responses",
    "langfuse==4.7.1",
    "asgi-correlation-id>=4.3.4",
    "py-zerox>=0.0.7,<1.0.0",
    "pandas>=2.3.2",
    "numpy>=1.24.0",
    "scikit-learn>=1.7.1",
    "celery>=5.3.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "flower>=2.0.1",
    "google-genai>=1.59.0",
    "sarvamai>=0.1.25",
    "pydub>=0.25.1",
    "jiwer>=3.1.0",
    "indic-nlp-library>=0.92",
    "whisper-normalizer>=0.1.12",
    "elevenlabs>=2.38.1",
    "google-auth>=2.49.1",
    "gevent>=25.9.1",
    "openpyxl>=3.1.5",
    "litellm>=1.83.10",
    "anthropic>=0.104.1",
    "google-cloud-storage>=3.10.1",
    "filetype>=1.2.0",
]

[tool.uv]
override-dependencies = [
    "pillow>=12.1.1",
    "cryptography>=46.0.5",
    "werkzeu>=3.1.6",
    "pypdf>=3.9.0",
]
dev-dependencies = [
    "pytest>=9.0.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ai-cli = "app.cli.main:cli"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", ".venv", "venv", "app/alembic"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Resolve project deps from the local venv (pyright runs in an isolated uvx env).
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
